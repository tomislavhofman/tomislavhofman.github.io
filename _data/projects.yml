# Home page project grid, in display order.
#
# Each entry becomes one grid cell. The cell's inner visual comes from the
# matching partial in _includes/home-<id>.html (home-game.html, ...), so adding
# a project is just: append an entry here + add a home-<id>.html partial.
#   id        unique id; selects _includes/home-<id>.html
#   url       link target; omit (or leave empty) for entries that live on the
#             page itself (e.g. the game)
#   external  true when url points off-site (opens in a new tab)
#   label     hint row text shown at the bottom of the entry
#   accent    accent colour for the console frame and glow
#   name      project name shown under the console
#   desc      one-line description shown under the name
#   status    short status chip (e.g. "Live", "In beta", "Just for fun")
#   cta       link text for the project button (omit for entries without a url)
- id: invoicesheet
  url: "/invoicesheet/"
  external: false
  accent: "#2dd4bf"
  label: "InvoiceSheet · open ▸"
  name: "InvoiceSheet"
  desc: "Turns piles of e-invoices (XRechnung, Peppol, ZUGFeRD, Factur-X, eRačun) into one Excel sheet. Runs in the browser; nothing is uploaded."
  status: "Live"
  cta: "Open InvoiceSheet"

- id: cardstitch
  url: "/cardstitch/"
  external: false
  accent: "#38bdf8"
  label: "CardStitch · open ▸"
  name: "CardStitch"
  desc: "Android app for trading card sellers: photographs both sides of a card and stitches them into one listing-ready image."
  status: "In beta"
  cta: "See CardStitch"

- id: game
  accent: "#22ff55"
  label: "Fly · tap to play"
  name: "Fly"
  desc: "A tiny browser game, just for fun. Press space or tap to fly."
  status: "Just for fun"

