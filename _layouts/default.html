<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.cardstitch %}{{ page.title }}{% elsif page.title == site.title %}{{ page.title }}{% else %}{{ page.title }} – {{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/css/custom.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body{% if page.url == "/" %} class="home-page"{% endif %}>
  <a href="#main-content" class="visually-hidden focusable">Skip to main content</a>
  {% include nav.html %}
  <main id="main-content" tabindex="-1">
    {{ content }}
  </main>
  <footer>
    <p class="footer-copy">&copy; {{ site.time | date: '%Y' }} Tomislav Hofman</p>
    <nav class="footer-links" aria-label="Contact and social links">
      <a href="https://github.com/tomislavhofman" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/tomislav-hofman/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="mailto:contact@hofman.tech">contact@hofman.tech</a>
    </nav>
  </footer>
</body>
</html>
