<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} · Tomislav Hofman</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<meta name="theme-color" content="#2f78c8">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/fonts.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/custom.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/osijek.css' | relative_url }}">
</head>
<body class="oh oh-page">
<a href="#main-content" class="visually-hidden focusable">Skip to content</a>

<nav class="oh-bar is-shown" aria-label="Main">
  <a class="oh-bar__name" href="{{ '/' | relative_url }}">Tomislav Hofman</a>
  <span class="oh-bar__links">
    <a class="oh-chip" href="{{ '/#work' | relative_url }}">Work</a>
    <a class="oh-chip" href="{{ '/#values' | relative_url }}">About</a>
    <a class="oh-chip" href="{{ '/#contact' | relative_url }}">Contact</a>
  </span>
</nav>

<main class="oh-main" id="main-content" tabindex="-1">
  <section class="oh-section oh-doc-section">
    <div class="oh-wrap">
      <article class="oh-panel oh-doc">
        {{ content }}
      </article>
    </div>
  </section>
</main>

<footer class="oh-footer">
  <p>© {{ site.time | date: '%Y' }} Tomislav Hofman · Made in Osijek.</p>
  <p><a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/legal/' | relative_url }}">Legal</a></p>
</footer>
</body>
</html>
